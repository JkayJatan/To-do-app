<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">

        <h1><img src="logo.png" alt="logo">To-Do App </h1>
        <div class="count">
            <div>Task Pending(0)</div>
            <div>Task Completed(N.A)</div>
        </div>
        <h3>Task List</h3>
        <ul id="taskList">
        </ul>
        <form action=""><input type="text" placeholder="Add a new task..." id="taskinput">
            <button id="addtaskbtn">Add Task</button>
        </form>


    </div>
    <script src="app.js"></script>
</body>

</html>
