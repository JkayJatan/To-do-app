<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TO-DO-APP</title>
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="app">
            <div class="main">
                <h1>To Do App <img src="assets/logo.png" alt="logo"></h1>
                <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">🌙</button>
            </div>
            <div class="row">
                <input type="text" id="input-box" placeholder="Add your text" aria-label="Task input">
                <button id="add-button" class="add-btn" onclick="addTask()" aria-label="Add task">
                    <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    <span class="btn-text">Add</span>
                </button>
            </div>
            <ul id="list-container"></ul>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
